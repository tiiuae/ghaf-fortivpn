[package]
name = "ghaf-fortivpn-service"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
openssl = "0.10.73"
tempfile = "3.21.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "process", "io-util", "time"] }
uuid = { version = "1.18.0", features = ["v4"] }
zbus = { version = "6.3.0", default-features = false, features = ["tokio", "proxy", "service"] }
zeroize = "1.8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"
pkg-config = "0.3"
